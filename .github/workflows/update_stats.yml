name: Update Match Stats

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC, after late kickoffs
  workflow_dispatch:

concurrency: update-stats

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Scripts use only Node built-ins: no npm install needed.
      - name: Test parser
        run: npm test

      - name: Ingest from FotMob
        run: npm run scrape

      - name: Commit & push
        run: |
          git config user.name 'Stats Bot'
          git config user.email 'stats-bot@noreply.github.com'
          git add src/lib/data_ingested.ts public/data/matches.json src/lib/titans_data.ts
          if git diff --cached --quiet; then
            echo "::notice::No new matches."
          else
            # Vercel deploys every push to main (it ignores [skip ci]), so this push is the site update.
            git commit -m "chore(stats): update match and player data [skip ci]"
            git push
            echo "::notice::Stats updated and pushed."
          fi
